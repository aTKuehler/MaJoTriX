<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apfel Spiel</title>
    <style>
        /* Hier kannst du deine Styles für das Spiel und die Buttons hinzufügen */
        #spiel {
            display: none; /* Spielbereich zu Beginn ausblenden */
            text-align: center;
        }
        canvas {
            border: 2px solid black;
        }
    </style>
</head>
<body>
<!-- Hauptmenü mit dem Button zum Starten des Spiels -->
<div id="hauptmenu">
    <button onclick="spielen()">Spielen</button>
</div>

<!-- Spielbereich, der nach dem Start eingeblendet wird -->
<div id="spiel">
    <h2>Das Spiel läuft!</h2>
    <canvas id="gameCanvas" width="500" height="400"></canvas>
</div>


<script src="testMajo.js"></script>
</body>
</html>
